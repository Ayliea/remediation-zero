<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img"
     aria-label="Which identity can reach which resource in Remediation Zero. Six service accounts run the fleet, each granted only what its own agent needs. The chase identity alone can read the tracker token from Secret Manager and file GitHub issues; the exception identity is refused that token, and a Cloud Run job running as that identity proves it. The reporting identity can read the operational database but is denied writes to it, holding write access only to a separate reports database, proven the same way. The console identity holds viewer access and nothing else. The deployed agent holds a reader only, because an Agent Engine runs as a single service account.">
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6B3A"/>
    </marker>
    <marker id="no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A33A2A"/>
    </marker>
    <marker id="pl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#767D87"/>
    </marker>
  </defs>

  <rect width="1280" height="800" fill="#F7F8F9"/>

  <text x="40" y="46" font-family="IBM Plex Mono, monospace" font-size="16" fill="#16181D" letter-spacing="2.2">WHO CAN TOUCH WHAT</text>
  <text x="40" y="70" font-family="Source Sans 3, sans-serif" font-size="14.5" fill="#4A5058">Every agent runs under its own service account. No shared credential. Both denials below are proven by performing the action.</text>

  <text x="40" y="110" font-family="IBM Plex Mono, monospace" font-size="13" fill="#767D87" letter-spacing="1.6">IDENTITY</text>
  <text x="880" y="110" font-family="IBM Plex Mono, monospace" font-size="13" fill="#767D87" letter-spacing="1.6">MAY REACH</text>
  <line x1="40" y1="120" x2="1240" y2="120" stroke="#C7CBD1" stroke-width="1"/>

  <!-- ===================== resources (right) ===================== -->
  <rect x="880" y="146" width="262" height="50" rx="2" fill="#fff" stroke="#2F6B3A" stroke-width="1.5"/>
  <text x="896" y="167" font-family="IBM Plex Mono, monospace" font-size="14" fill="#16181D">rz-github-token</text>
  <text x="896" y="186" font-family="Source Sans 3, sans-serif" font-size="12.5" fill="#4A5058">Secret Manager · fetched per request</text>

  <rect x="880" y="212" width="262" height="42" rx="2" fill="#fff" stroke="#2F6B3A" stroke-width="1.5"/>
  <text x="896" y="238" font-family="IBM Plex Mono, monospace" font-size="14" fill="#16181D">GitHub Issues</text>

  <rect x="880" y="392" width="262" height="50" rx="2" fill="#fff" stroke="#16181D" stroke-width="1.5"/>
  <text x="896" y="413" font-family="IBM Plex Mono, monospace" font-size="14" fill="#16181D">Firestore (default)</text>
  <text x="896" y="432" font-family="Source Sans 3, sans-serif" font-size="12.5" fill="#4A5058">findings · decisions · tickets</text>

  <rect x="880" y="556" width="262" height="50" rx="2" fill="#fff" stroke="#2F6B3A" stroke-width="1.5"/>
  <text x="896" y="577" font-family="IBM Plex Mono, monospace" font-size="14" fill="#16181D">Firestore (reports)</text>
  <text x="896" y="596" font-family="Source Sans 3, sans-serif" font-size="12.5" fill="#4A5058">a separate database</text>

  <!-- ===================== rz-chase ===================== -->
  <rect x="40" y="146" width="270" height="66" rx="2" fill="#fff" stroke="#16181D" stroke-width="1.5"/>
  <text x="56" y="172" font-family="IBM Plex Mono, monospace" font-size="15" fill="#16181D">rz-chase</text>
  <text x="56" y="192" font-family="Source Sans 3, sans-serif" font-size="13" fill="#4A5058">tickets, nudges, escalation</text>
  <text x="56" y="207" font-family="IBM Plex Mono, monospace" font-size="11.5" fill="#767D87">rz-worker-chase</text>

  <line x1="310" y1="171" x2="874" y2="171" stroke="#2F6B3A" stroke-width="1.6" marker-end="url(#ok)"/>
  <rect x="470" y="158" width="130" height="20" fill="#F7F8F9"/>
  <text x="476" y="173" font-family="IBM Plex Mono, monospace" font-size="11.5" fill="#2F6B3A">secretAccessor</text>

  <path d="M310,196 L400,196 L400,233 L874,233" fill="none" stroke="#2F6B3A" stroke-width="1.6" marker-end="url(#ok)"/>
  <rect x="470" y="221" width="212" height="20" fill="#F7F8F9"/>
  <text x="476" y="236" font-family="Source Sans 3, sans-serif" font-size="12.5" fill="#2F6B3A">files the ticket a person opens</text>

  <!-- ===================== rz-exception ===================== -->
  <rect x="40" y="300" width="270" height="66" rx="2" fill="#fff" stroke="#16181D" stroke-width="1.5"/>
  <text x="56" y="326" font-family="IBM Plex Mono, monospace" font-size="15" fill="#16181D">rz-exception</text>
  <text x="56" y="346" font-family="Source Sans 3, sans-serif" font-size="13" fill="#4A5058">risk acceptances, expiry</text>
  <text x="56" y="361" font-family="IBM Plex Mono, monospace" font-size="11.5" fill="#767D87">rz-worker-exception</text>

  <!-- denied: this edge must leave from rz-exception, not from the row above -->
  <line x1="310" y1="326" x2="874" y2="196" stroke="#A33A2A" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#no)"/>
  <line x1="578" y1="248" x2="606" y2="274" stroke="#A33A2A" stroke-width="2.6"/>
  <line x1="606" y1="248" x2="578" y2="274" stroke="#A33A2A" stroke-width="2.6"/>
  <text x="470" y="308" font-family="IBM Plex Mono, monospace" font-size="12" fill="#A33A2A">the tracker token · DENIED</text>
  <text x="470" y="326" font-family="Source Sans 3, sans-serif" font-size="12.5" fill="#A33A2A">exception-secret-probe runs AS this identity</text>
  <text x="470" y="343" font-family="Source Sans 3, sans-serif" font-size="12.5" fill="#A33A2A">and is refused. It cannot reach the tracker.</text>

  <!-- ===================== rz-reporting ===================== -->
  <rect x="40" y="470" width="270" height="66" rx="2" fill="#fff" stroke="#16181D" stroke-width="1.5"/>
  <text x="56" y="496" font-family="IBM Plex Mono, monospace" font-size="15" fill="#16181D">rz-reporting</text>
  <text x="56" y="516" font-family="Source Sans 3, sans-serif" font-size="13" fill="#4A5058">metrics and summaries</text>
  <text x="56" y="531" font-family="IBM Plex Mono, monospace" font-size="11.5" fill="#767D87">reporting-write-probe</text>

  <line x1="310" y1="490" x2="874" y2="430" stroke="#A33A2A" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#no)"/>
  <line x1="578" y1="447" x2="606" y2="473" stroke="#A33A2A" stroke-width="2.6"/>
  <line x1="606" y1="447" x2="578" y2="473" stroke="#A33A2A" stroke-width="2.6"/>
  <text x="640" y="500" font-family="IBM Plex Mono, monospace" font-size="12" fill="#A33A2A">write a ticket · DENIED</text>
  <text x="640" y="518" font-family="Source Sans 3, sans-serif" font-size="12.5" fill="#A33A2A">runs AS this identity, and is refused</text>

  <path d="M310,520 L400,520 L400,581 L874,581" fill="none" stroke="#2F6B3A" stroke-width="1.6" marker-end="url(#ok)"/>
  <rect x="430" y="569" width="126" height="20" fill="#F7F8F9"/>
  <text x="436" y="584" font-family="IBM Plex Mono, monospace" font-size="11.5" fill="#2F6B3A">datastore.user</text>

  <!-- ===================== console-reader ===================== -->
  <rect x="40" y="628" width="270" height="66" rx="2" fill="#fff" stroke="#16181D" stroke-width="1.5"/>
  <text x="56" y="654" font-family="IBM Plex Mono, monospace" font-size="15" fill="#16181D">console-reader</text>
  <text x="56" y="674" font-family="Source Sans 3, sans-serif" font-size="13" fill="#4A5058">the page a stranger reaches</text>
  <text x="56" y="689" font-family="IBM Plex Mono, monospace" font-size="11.5" fill="#767D87">remediation-zero-console</text>

  <path d="M310,660 L700,660 L700,442 L874,442" fill="none" stroke="#767D87" stroke-width="1.4" marker-end="url(#pl)"/>
  <rect x="430" y="648" width="230" height="20" fill="#F7F8F9"/>
  <text x="436" y="663" font-family="IBM Plex Mono, monospace" font-size="11.5" fill="#767D87">datastore.viewer · read only</text>

  <!-- ===================== the deployed agent ===================== -->
  <rect x="880" y="640" width="352" height="98" rx="2" fill="#fff" stroke="#3B5BDB" stroke-width="1.5"/>
  <text x="896" y="664" font-family="IBM Plex Mono, monospace" font-size="13.5" fill="#3B5BDB">Agent Engine · the deployed agent</text>
  <text x="896" y="686" font-family="Source Sans 3, sans-serif" font-size="12.5" fill="#4A5058">An Agent Engine runs as one service account,</text>
  <text x="896" y="703" font-family="Source Sans 3, sans-serif" font-size="12.5" fill="#4A5058">so it is given a reader and nothing else. Triage</text>
  <text x="896" y="720" font-family="Source Sans 3, sans-serif" font-size="12.5" fill="#4A5058">on Gemini, review on Gemma, recall from Memory</text>
  <text x="896" y="733" font-family="Source Sans 3, sans-serif" font-size="12.5" fill="#A33A2A">Bank. It reasons; it cannot write.</text>

  <!-- ===================== footer ===================== -->
  <line x1="40" y1="726" x2="820" y2="726" stroke="#C7CBD1" stroke-width="1"/>
  <text x="40" y="748" font-family="Source Sans 3, sans-serif" font-size="12.5" fill="#4A5058">Firestore IAM is database-scoped, not collection-scoped, and Security Rules are bypassed by server SDKs. So the</text>
  <text x="40" y="765" font-family="Source Sans 3, sans-serif" font-size="12.5" fill="#4A5058">boundary sits where IAM can enforce it — a separate database, and a grant on the secret itself — and the remaining</text>
  <text x="40" y="782" font-family="Source Sans 3, sans-serif" font-size="12.5" fill="#4A5058">separation is application-level, named as such rather than blurred into the same sentence.</text>
</svg>
