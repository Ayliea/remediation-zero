# The console image, built the same way the worker image already is.
#
# `gcloud run deploy --source` generates its own build config and does not set
# a logging option. Cloud Build runs as the compute default service account
# here, and a build with a user-specified service account and no logging option
# is rejected -- as INTERNAL_ERROR with an empty statusDetail, which names
# neither the cause nor the fix. Two console deploys sat QUEUED for forty
# minutes and then failed that way on 2026-08-28, having worked the day before.
#
# cloudbuild.worker.yaml already carried CLOUD_LOGGING_ONLY for this reason.
# The console now builds through the same path rather than through the one
# convenience flag that cannot express the option it needs.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "Dockerfile", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
options:
  logging: CLOUD_LOGGING_ONLY
