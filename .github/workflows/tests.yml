# The suite, on every push. No secrets are configured and none are needed:
# the tests touch no Google Cloud service, which is why this can run at all
# on a runner that has never authenticated. That is a property worth keeping.
# The repository rule is that a cloud service is never mocked to make a test
# pass -- the tests that need the real thing are in verify-controls.sh, which
# performs the action each control is meant to stop and cannot run here.
#
# So a green badge means the logic holds. It does not mean the controls hold;
# that claim needs the deployment and is made separately.

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.12.3 locally. ADK requires >=3.10; the constraints file is
          # generated against 3.12, so the runner matches rather than floats.
          python-version: '3.12'
          cache: pip

      - name: Install pinned dependencies
        # requirements.txt carries the agent framework, requirements-ui.txt
        # the FastAPI console. Both are needed: the console and worker tests
        # import fastapi, and httpx reaches the test client transitively
        # through google-adk. Constraints pin the whole resolved tree.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ui.txt -c constraints-3.12.txt

      - name: Run the suite
        # No env and no secrets. conftest seeds the three settings the agent
        # modules read at import time, so a clean checkout is all the suite
        # needs. If this step ever requires something here, that is a signal
        # the suite has grown a dependency on a developer's .env.
        run: pytest -q

      - name: Verify every Python module compiles
        run: python -m compileall -q agents scripts tools ui worker

      - name: Verify deployment shell syntax
        run: bash -n scripts/*.sh

      - name: Reject committed whitespace errors
        run: git show --check --oneline --no-renames HEAD

      - name: Build the console container
        run: docker build --pull=false -t remediation-zero-console:test .

      - name: Build the scheduled-worker container
        run: docker build --pull=false -f Dockerfile.worker -t remediation-zero-worker:test .

      - uses: hashicorp/setup-terraform@v3

      - name: Verify infrastructure formatting
        run: terraform -chdir=infra fmt -check

      - name: Verify infrastructure configuration
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate
